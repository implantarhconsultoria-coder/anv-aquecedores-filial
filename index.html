const $=html=>{document.getElementById("root").innerHTML=html;bind()};

function backendProduct(p){return {code:p.code||null,sku:p.sku||null,gtin:p.gtin||null,name:p.title||p.name||"Produto",brand:p.brand||null,model:p.model||null,category:p.category||null,gas_type:p.gas_type||null,voltage:p.voltage||null,color:p.color||null,material:p.material||null,application:p.application||null,compatibility:p.compatibility||null,description:p.description||descOf(p),technical_details:p.technical_details||null,package_length_cm:numFrom(p.package_length_cm||p.length),package_width_cm:numFrom(p.package_width_cm),package_height_cm:numFrom(p.package_height_cm),package_weight_g:numFrom(p.package_weight_g||p.weight),ncm:p.ncm||null,cest:p.cest||null,fiscal_origin:p.fiscal_origin||null,cost_price:Number(p.cost_price||0),sale_price:Number(p.sale_price??p.price??0),minimum_price:Number(p.minimum_price||0),stock:Number(p.stock??p.qty??0),minimum_stock:Number(p.minimum_stock??state.minStock??5),status:p.dbStatus||"ativo"}}

function uiProduct(p){return {id:p.id,persisted:true,code:p.code||"",sku:p.sku||"",gtin:p.gtin||"",title:p.name||"Produto",brand:p.brand||"",model:p.model||"",category:p.category||"",gas_type:p.gas_type||"",voltage:p.voltage||"",color:p.color||"",material:p.material||"",application:p.application||"",compatibility:p.compatibility||"",length:p.package_length_cm?`${p.package_length_cm} cm`:"",package_width_cm:p.package_width_cm||"",package_height_cm:p.package_height_cm||"",weight:p.package_weight_g?`${p.package_weight_g} g`:"",price:Number(p.sale_price||0),cost_price:Number(p.cost_price||0),qty:Number(p.stock||0),minimum_stock:Number(p.minimum_stock||state.minStock||5),description:p.description||"",technical_details:p.technical_details||"",ncm:p.ncm||"",cest:p.cest||"",fiscal_origin:p.fiscal_origin||"",images:(p.images||[]).map(x=>x.url).filter(Boolean),status:p.marketplace_status||"CADASTRADO"}}
async function boot(){try{runtime.health=await api("/api/health");runtime.api=true;runtime.auth=!!runtime.health?.configured?.auth;runtime.db=!!runtime.health?.configured?.database;runtime.marketplace=!!runtime.health?.configured?.marketplace}catch{runtime.api=false}if(runtime.auth){try{const me=await api("/api/auth/me");runtime.session=true;state.user=me.user;save()}catch{runtime.session=false;state.user=null;save()}}if(runtime.session){await syncReal().catch(()=>{})}render()}
async function syncReal(){if(runtime.db){try{const list=await api("/api/products");if(Array.isArray(list)&&list.length){const localById=new Map(state.products.map(p=>[p.id,p]));state.products=list.map(x=>({...uiProduct(x),images:localById.get(x.id)?.images||[]}))}const ord=await api("/api/orders");if(Array.isArray(ord))state.orders=ord;runtime.notifications=await api("/api/notifications").catch(()=>[])}catch(e){console.warn(e)}}try{runtime.mlStatus=await api("/api/integrations/mercado-livre/status");state.ml.connected=runtime.mlStatus.status==="CONECTADO";state.ml.nickname=runtime.mlStatus.account?.nickname||null}catch{}save()}
function login(){const backendHint=runtime.auth?"Acesso seguro da operação":"Prévia local · conexão segura será ativada na configuração";$(`<div class="login"><div class="brand">ANV</div><div class="silver">AQUECEDORES</div><div class="sub">LOJA AUTORIZADA</div><div class="rinnai">Rinnai</div><div class="small">Filial Digital</div><input id="email" placeholder="E-mail" /><input id="pw" type="password" placeholder="Senha" /><button class="btn" id="enter">Entrar</button><p id="loginmsg" class="small">${backendHint}</p><p class="small">Operação de peças e kits. Aquecedor não entra neste início.</p></div>`)}
function shell(body){const realUnread=runtime.notifications.filter(x=>!x.read_at).length;const localUnread=state.notices.filter(x=>!x.read).length;const n=realUnread+localUnread;$(`<header class="app"><div class="mark">ANV <span>Rinnai</span></div><div class="small">${n?n+" aviso"+(n>1?"s":""):"Filial Digital"}</div></header><main>${body}</main><nav><button data-tab="painel" class="${state.tab==="painel"?"on":""}">Painel</button><button data-tab="produtos" class="${state.tab==="produtos"?"on":""}">Produtos</button><button data-tab="novo" class="${state.tab==="novo"?"on":""}">Cadastrar</button><button data-tab="pedidos" class="${state.tab==="pedidos"?"on":""}">Pedidos</button><button data-tab="ml" class="${state.tab==="ml"?"on":""}">Conta</button></nav>`)}
function painel(){const low=state.products.filter(p=>Number(p.qty??p.stock??0)<=Number(p.minimum_stock??state.minStock));const published=state.products.filter(p=>p.status==="PUBLICADO"||p.itemId).length;const notices=runtime.notifications.filter(x=>!x.read_at).slice(0,4);shell(`<h1>Painel</h1><div class="row"><b>${state.products.length}</b><span>peças e kits</span></div><div class="row"><b>${state.products.reduce((a,p)=>a+Number(p.qty??p.stock??0),0)}</b><span>unidades</span></div><div class="row"><b>${published}</b><span>anúncios vinculados</span></div><div class="row"><b>${low.length}</b><span>no ponto de compra</span></div>${notices.map(n=>`<div class="${n.kind==="NEW_ORDER"?"ok":"alert"}"><b>${esc(n.title)}</b><div class="small">${esc(n.message||"")}</div></div>`).join("")}${low.slice(0,4).map(p=>`<div class="alert">${esc(p.title)} chegou em ${Number(p.qty??p.stock??0)}. Repor.</div>`).join("")}${state.products[0]?`<div class="card"><b>${esc(state.products[0].title)}</b><p class="small">${esc(state.products[0].sku||"sem SKU")} · estoque ${Number(state.products[0].qty??state.products[0].stock??0)}</p><span class="pill">${esc(state.products[0].status||"CADASTRADO")}</span></div>`:`<p class="small">Nenhuma peça ainda. O cadastro nasce aqui.</p>`}`)}

function novo(){shell(`<h1>Cadastrar</h1><p class="small">Uma foto real basta para começar. O ANV organiza os dados, valida o Mercado Livre e prepara o anúncio.</p><input id="sku" placeholder="SKU" /><input id="title" placeholder="Peça, ex. Flexível água 40 cm 1/2" /><input id="brand" placeholder="Marca" /><input id="model" placeholder="Modelo" /><input id="length" placeholder="Comprimento, ex. 40 cm" /><input id="diameter" placeholder="Diâmetro, ex. 1/2" /><input id="material" placeholder="Material" /><input id="weight" placeholder="Peso da embalagem, ex. 180 g" /><input id="price" type="number" step="0.01" placeholder="Preço de venda" /><input id="qty" type="number" placeholder="Estoque" /><input id="photo" type="file" accept="image/*" capture="environment" /><button class="btn" id="save">Salvar e preparar anúncio</button><p id="msg" class="small"></p>`)}
function ficha(p){if(!p)return produtos();const pf=p.preflight;const categories=(pf?.suggestions||[]).map(s=>`<button class="btn ghost cat" data-cat="${esc(s.category_id)}">${esc(s.category_name||s.category_id)}</button>`).join("");const required=(pf?.required_missing||[]).map(a=>`<input class="attr" data-attr="${esc(a.id)}" placeholder="${esc(a.name||a.id)}" value="${esc(p.attrOverrides?.[a.id]||"")}" />`).join("");const blockers=(pf?.blockers||[]).map(x=>`<div class="alert">${esc(x)}</div>`).join("");const warnings=(pf?.warnings||[]).map(x=>`<div class="note">${esc(x)}</div>`).join("");const imageNote=(p.images||[]).length<5?`<div class="note"><b>Fotos complementares</b><p class="small">A foto original está preservada. O motor de geração das imagens comerciais ainda precisa ser conectado; o ANV não duplica a mesma foto fingindo que gerou novas.</p></div>`:"";shell(`<h1>${esc(p.title)}</h1><p class="small">${esc(p.sku||"sem SKU")} · estoque ${Number(p.qty??p.stock??0)} · mínimo ${Number(p.minimum_stock??state.minStock)}</p><div class="shots">${(p.images||[]).map(src=>`<img src="${src}" alt="Produto" />`).join("")}</div>${imageNote}<div class="note"><b>Título sugerido</b><p>${esc(p.listingTitle||titleOf(p))}</p><b>Descrição</b><p class="small">${esc(p.description||descOf(p))}</p></div>${pf?`<div class="${pf.ready?"ok":"note"}"><b>${pf.ready?"PRONTO PARA PUBLICAR":"Pré-validação concluída"}</b><p class="small">${esc(pf.selected_category?.name||pf.selected_category?.id||"Categoria em análise")}</p></div>${blockers}${warnings}${required?`<div class="card"><b>Só falta preencher</b><p class="small">Campos obrigatórios da categoria.</p>${required}<button class="btn ghost" id="reval">Revalidar</button></div>`:""}${categories?`<div class="card"><b>Categorias encontradas</b>${categories}</div>`:""}`:`<div class="note">O ANV ainda não consultou a categoria e os atributos obrigatórios do Mercado Livre.</div>`}<button class="btn" id="pub">${pf?.ready?"Publicar no Mercado Livre":"Preparar anúncio"}</button><button class="btn ghost" id="goorders">Ir para pedidos</button><p id="msg" class="small"></p>${p.itemId?`<div class="ok"><b>Anúncio vinculado</b><p class="small">${esc(p.itemId)}</p>${p.permalink?`<a href="${esc(p.permalink)}" target="_blank" rel="noreferrer">Abrir no Mercado Livre</a>`:""}</div>`:""}`)}

function conta(){const st=runtime.mlStatus;const configured=st?.configured??runtime.marketplace;const connected=st?.status==="CONECTADO"||state.ml.connected;const nickname=st?.account?.nickname||state.ml.nickname;const apiState=runtime.api?`${runtime.db?"Banco conectado":"Banco pendente"} · ${runtime.auth?"Login seguro":"Login pendente"}`:"Backend indisponível";shell(`<h1>Conta</h1><div class="note"><b>${connected?"Mercado Livre conectado":"Mercado Livre desconectado"}</b><p class="small">${nickname?esc(nickname):"A conta só fica conectada depois do OAuth oficial e /users/me HTTP 200."}</p></div><button class="btn" id="conn" ${configured?"":"disabled"}>${connected?"Reconectar conta":"Conectar conta"}</button><p class="small">${configured?"Integração configurada.":"Credenciais do Mercado Livre ainda não configuradas na Vercel."}</p><p class="small">${apiState}</p><button class="btn ghost" id="ap">Aprovação</button><button class="btn ghost" id="au">Automática</button><p class="small">Modo interno atual: ${esc(state.ml.mode||"aprovacao")}.</p><button class="btn ghost" id="logout">Sair</button>`)}
function render(){if(!state.user)return login();if(state.tab==="painel")return painel();if(state.tab==="produtos")return produtos();if(state.tab==="novo")return novo();if(state.tab==="ficha")return ficha(state.products.find(p=>p.id===state.open));if(state.tab==="pedidos")return pedidos();if(state.tab==="ml")return conta()}
function titleOf(p){return `${p.title||p.name||""} ${p.brand||""} ${p.model||""} ${p.length||""} ${p.diameter||""}`.replace(/\s+/g," ").trim().slice(0,60)}

function specSheet(p){const c=document.createElement("canvas");c.width=1200;c.height=1200;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,1200,1200);g.fillStyle="#111";g.font="700 54px sans-serif";g.fillText("ANV Aquecedores",70,120);g.fillStyle="#e10600";g.font="700 36px sans-serif";g.fillText("Loja autorizada Rinnai",70,180);g.fillStyle="#111";g.font="700 48px sans-serif";g.fillText((p.title||"").slice(0,32),70,280);[["SKU",p.sku],["Marca",p.brand],["Medida",p.length],["Diâmetro",p.diameter],["Material",p.material],["Peso",p.weight]].forEach((ln,i)=>{g.font="32px sans-serif";g.fillStyle="#666";g.fillText(ln[0],70,380+i*70);g.fillStyle="#111";g.fillText(ln[1]||"—",320,380+i*70)});return c.toDataURL("image/jpeg",.9)}
async function prepareProduct(p){if(!runtime.api||!runtime.session){p.missing=[];if(!p.sku)p.missing.push("SKU ausente");if(!p.price)p.missing.push("Preço ausente");if(!(p.images||[]).length)p.missing.push("Foto ausente");p.status=p.missing.length?"INCOMPLETO":"AGUARDANDO CONEXÃO ML";save();render();return}const body={product_id:p.persisted?p.id:null,product:p.persisted?null:backendProduct(p),category_id:p.categoryId||null,attributes:p.attrOverrides||{},images:p.images||[]};const pf=await api("/api/marketplace/preflight",{method:"POST",body});p.preflight=pf;p.categoryId=pf.selected_category?.id||p.categoryId||null;p.status=pf.ready?"PRONTO PARA PUBLICAR":"REVISAR";save();render()}

ap.onclick=()=>{state.ml.mode="aprovacao";save();render()};const au=document.getElementById("au");if(au)au.onclick=()=>{state.ml.mode="auto";save();render()};const logout=document.getElementById("logout");if(logout)logout.onclick=async()=>{if(runtime.session)await api("/api/auth/logout",{method:"POST",body:{}}).catch(()=>{});runtime.session=false;state.user=null;save();render()}}
