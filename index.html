<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ANV Filial Digital</title>
<style>
:root{--red:#e10600;--ink:#111;--muted:#6b7280;--line:#ececec}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{max-width:430px;margin:0 auto;min-height:100vh}header.app{display:flex;justify-content:space-between;padding:14px 16px 8px}.mark{font-weight:800}.mark span{color:var(--red)}main{padding:8px 16px 96px}h1{font-size:32px;margin:8px 0 16px}.row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.row b{font-size:28px}.card{border:1px solid #e6e6e6;border-radius:16px;padding:12px;margin-top:16px}.pill{display:inline-block;border:1px solid var(--red);color:var(--red);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:var(--red);color:#fff}.btn.ghost{background:#fff;color:#111;border:1px solid #111;margin-top:8px}input{width:100%;border:0;background:#f3f3f3;border-radius:12px;padding:14px;margin:8px 0;font-size:16px}nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100%);background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 4px 16px}nav button{flex:1;border:0;background:none;color:#9a9a9a;font-size:11px}nav button.on{color:var(--red);font-weight:700}.login{padding:48px 22px;text-align:center}.brand{font-weight:800;font-size:42px;color:#2f6fed;letter-spacing:-.04em}.silver{letter-spacing:.22em;color:#8d8d8d;font-weight:700}.sub{color:#8a8a8a;letter-spacing:.18em;font-size:12px;margin-top:18px}.rinnai{color:var(--red);font-size:32px;font-weight:800}.note,.alert,.ok{border-radius:12px;padding:12px;margin:10px 0}.note{background:#f6f6f6}.alert{background:#fff4f4;color:#9b1c1c}.ok{background:#f4fff6}.shots{display:flex;gap:8px;overflow:auto}.shots img{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid #eee}.small{color:var(--muted);font-size:13px}
</style></head><body><div id="root"></div><script>
const KEY="anv-filial-v1";
const state=JSON.parse(localStorage.getItem(KEY)||"null")||{user:null,tab:"painel",minStock:5,ml:{connected:false,nickname:null,mode:"aprovacao"},products:[],orders:[],notices:[]};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const $=html=>{document.getElementById("root").innerHTML=html;bind()};
function login(){$(`<div class="login"><div class="brand">ANV</div><div class="silver">AQUECEDORES</div><div class="sub">LOJA AUTORIZADA</div><div class="rinnai">Rinnai</div><div class="small">Filial Digital</div><input id="email" placeholder="E-mail" /><input id="pw" type="password" placeholder="Senha" /><button class="btn" id="enter">Entrar</button><p class="small">Operação de peças e kits. Aquecedor não entra neste início.</p></div>`)}
function shell(body){const n=state.notices.filter(x=>!x.read).length;$(`<header class="app"><div class="mark">ANV <span>Rinnai</span></div><div class="small">${n?n+" aviso":"Filial Digital"}</div></header><main>${body}</main><nav><button data-tab="painel" class="${state.tab==="painel"?"on":""}">Painel</button><button data-tab="produtos" class="${state.tab==="produtos"?"on":""}">Produtos</button><button data-tab="novo" class="${state.tab==="novo"?"on":""}">Cadastrar</button><button data-tab="pedidos" class="${state.tab==="pedidos"?"on":""}">Pedidos</button><button data-tab="ml" class="${state.tab==="ml"?"on":""}">Conta</button></nav>`)}
function painel(){const low=state.products.filter(p=>p.qty<=state.minStock);shell(`<h1>Painel</h1><div class="row"><b>${state.products.length}</b><span>peças e kits</span></div><div class="row"><b>${state.products.reduce((a,p)=>a+p.qty,0)}</b><span>unidades</span></div><div class="row"><b>${state.products.filter(p=>p.status==="PUBLICADO").length}</b><span>anúncios vinculados</span></div><div class="row"><b>${low.length}</b><span>no ponto de compra</span></div>${low.map(p=>`<div class="alert">${p.title} chegou em ${p.qty}. Repor.</div>`).join("")}${state.products[0]?`<div class="card"><b>${state.products[0].title}</b><p class="small">${state.products[0].sku} · estoque ${state.products[0].qty}</p><span class="pill">${state.products[0].status}</span></div>`:`<p class="small">Nenhuma peça ainda. O cadastro nasce aqui.</p>`}`)}
function produtos(){shell(`<h1>Produtos</h1>`+(state.products.map(p=>`<div class="card" data-id="${p.id}"><b>${p.title}</b><p class="small">${p.sku} · ${p.brand||"sem marca"} · ${p.length||"—"} · R$ ${Number(p.price).toFixed(2)} · est. ${p.qty}</p><span class="pill">${p.status}</span></div>`).join("")||`<p class="small">Cadastre a mangueira, o flexível ou o kit. Não o aquecedor.</p>`))}
function novo(){shell(`<h1>Cadastrar</h1><p class="small">Uma foto basta para começar. A plataforma monta capa, quatro apoios e a ficha final.</p><input id="sku" placeholder="SKU" /><input id="title" placeholder="Peça, ex. Flexível água 40 cm 1/2" /><input id="brand" placeholder="Marca" /><input id="model" placeholder="Modelo" /><input id="length" placeholder="Comprimento, ex. 40 cm" /><input id="diameter" placeholder="Diâmetro, ex. 1/2" /><input id="material" placeholder="Material" /><input id="weight" placeholder="Peso, ex. 180 g" /><input id="price" type="number" placeholder="Preço de venda" /><input id="qty" type="number" placeholder="Estoque" /><input id="photo" type="file" accept="image/*" capture="environment" /><button class="btn" id="save">Salvar e montar anúncio</button><p id="msg" class="small"></p>`)}
function ficha(p){shell(`<h1>${p.title}</h1><p class="small">${p.sku} · estoque ${p.qty} · mínimo ${state.minStock}</p><div class="shots">${(p.images||[]).map(src=>`<img src="${src}" />`).join("")}</div><div class="note"><b>Título</b><p>${p.listingTitle}</p><b>Descrição</b><p class="small">${p.description}</p></div>${(p.missing||[]).map(m=>`<div class="alert">${m}</div>`).join("")||`<div class="ok">Pronto para publicar. Um toque sobe o anúncio e vincula.</div>`}<button class="btn" id="pub">Publicar no Mercado Livre</button><button class="btn ghost" id="desp">Despachei · dar baixa</button><p id="msg" class="small"></p>`)}
function pedidos(){shell(`<h1>Pedidos</h1>${state.orders.map(o=>`<div class="card"><b>${o.id}</b><p class="small">${o.sku} · qtd ${o.qty} · ${o.status}</p></div>`).join("")||`<p class="small">Quando vender, o aviso chega aqui e no celular.</p>`}<button class="btn ghost" id="sim">Simular venda da primeira peça</button><p id="msg" class="small"></p>`)}
function conta(){shell(`<h1>Conta</h1><div class="note"><b>${state.ml.connected?"Conectado":"Desconectado"}</b><p class="small">A conta só fica conectada depois de users/me HTTP 200.</p></div><button class="btn" id="conn">Conectar conta</button><p class="small">Modo: ${state.ml.mode}. Peças e kits sobem daqui.</p><button class="btn ghost" id="ap">Aprovação</button><button class="btn ghost" id="au">Automática</button>`)}
function render(){if(!state.user)return login();if(state.tab==="painel")return painel();if(state.tab==="produtos")return produtos();if(state.tab==="novo")return novo();if(state.tab==="ficha")return ficha(state.products.find(p=>p.id===state.open));if(state.tab==="pedidos")return pedidos();if(state.tab==="ml")return conta()}
function titleOf(p){return `${p.title} ${p.brand||""} ${p.length||""} ${p.diameter||""}`.replace(/\s+/g," ").trim().slice(0,60)}
function descOf(p){return [p.title+".",p.brand?`Marca: ${p.brand}.`:`"",p.length?`Comprimento: ${p.length}.`:`"",p.diameter?`Diâmetro: ${p.diameter}.`:`"",p.material?`Material: ${p.material}.`:`"",p.weight?`Peso: ${p.weight}.`:`"","Uso: instalação e manutenção. Especificação só com o que foi informado."].filter(Boolean).join(" ")}
function specSheet(p){const c=document.createElement("canvas");c.width=1200;c.height=1200;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,1200,1200);g.fillStyle="#111";g.font="700 54px sans-serif";g.fillText("ANV Aquecedores",70,120);g.fillStyle="#e10600";g.font="700 36px sans-serif";g.fillText("Loja autorizada Rinnai",70,180);g.fillStyle="#111";g.font="700 48px sans-serif";g.fillText((p.title||"").slice(0,32),70,280);[["SKU",p.sku],["Marca",p.brand],["Medida",p.length],["Diâmetro",p.diameter],["Material",p.material],["Peso",p.weight]].forEach((ln,i)=>{g.font="32px sans-serif";g.fillStyle="#666";g.fillText(ln[0],70,380+i*70);g.fillStyle="#111";g.fillText(ln[1]||"—",320,380+i*70)});return c.toDataURL("image/jpeg",.9)}
function bind(){const enter=document.getElementById("enter");if(enter)enter.onclick=()=>{state.user={email:email.value||"operacao@anv"};save();render()};document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();render()});document.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>{state.open=el.dataset.id;state.tab="ficha";save();render()});const saveBtn=document.getElementById("save");if(saveBtn)saveBtn.onclick=async()=>{const file=photo.files[0];const photoData=file?await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)}):"";const p={id:crypto.randomUUID(),sku:sku.value,title:title.value,brand:brand.value,model:model.value,length:length.value,diameter:diameter.value,material:material.value,weight:weight.value,price:Number(price.value||0),qty:Number(qty.value||0),images:[]};const missing=[];if(!p.sku)missing.push("SKU ausente");if(!p.price)missing.push("Preço ausente");if(!photoData)missing.push("Foto ausente");if(!p.length||!p.diameter)missing.push("Medida ou diâmetro ausente");p.missing=missing;p.listingTitle=titleOf(p);p.description=descOf(p);p.images=photoData?[photoData,photoData,photoData,photoData,photoData,specSheet(p)]:[specSheet(p)];p.status=missing.length?"INCOMPLETO":"PRONTO PARA PUBLICAR";state.products.unshift(p);state.open=p.id;state.tab="ficha";save();render()};const pub=document.getElementById("pub");if(pub)pub.onclick=()=>{const p=state.products.find(x=>x.id===state.open);if(!state.ml.connected){msg.textContent="Conta desconectada. Publicar só depois de users/me HTTP 200.";return}if(p.missing.length){msg.textContent=p.missing.join(" · ");return}p.status="PUBLICADO";save();render()};const desp=document.getElementById("desp");if(desp)desp.onclick=()=>{const p=state.products.find(x=>x.id===state.open);if(p.qty<1)return;p.qty-=1;state.orders.unshift({id:"ENV-"+Date.now().toString().slice(-6),sku:p.sku,qty:1,status:"despachado"});if(p.qty<=state.minStock)state.notices.unshift({text:p.title+" em "+p.qty+". Comprar.",read:false});save();render()};const sim=document.getElementById("sim");if(sim)sim.onclick=()=>{const p=state.products[0];if(!p){msg.textContent="Cadastre uma peça antes.";return}p.qty=Math.max(0,p.qty-1);const id="ML-"+Date.now().toString().slice(-6);state.orders.unshift({id,sku:p.sku,qty:1,status:"pago · avisar despacho"});state.notices.unshift({text:"Venda "+id+". Despachar "+p.title+".",read:false});save();render()};const conn=document.getElementById("conn");if(conn)conn.onclick=()=>{alert("Conexão real exige o aplicativo do Mercado Livre e users/me HTTP 200. Sem isso a conta permanece desconectada.")};const ap=document.getElementById("ap");if(ap)ap.onclick=()=>{state.ml.mode="aprovacao";save();render()};const au=document.getElementById("au");if(au)au.onclick=()=>{state.ml.mode="auto";save();render()}};
render();
</script></body></html>
