<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ANV Filial Digital — Desktop</title>
<style>
:root{--red:#e10600;--ink:#111;--muted:#6b7280;--line:#e9e9e9;--soft:#f6f7f8;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--soft)}button,input{font:inherit}.app{min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:#fff;border-right:1px solid var(--line);padding:26px 16px;z-index:10}.brand{font-weight:900;font-size:22px;padding:0 10px 24px}.brand span{color:var(--red)}.subbrand{font-size:12px;color:var(--muted);font-weight:500;margin-top:4px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:13px 14px;border-radius:10px;color:#666;cursor:pointer}.nav button.on{background:#fff1f1;color:var(--red);font-weight:800}.statusbox{position:absolute;left:16px;right:16px;bottom:22px;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;color:var(--muted)}.work{margin-left:250px;min-height:100vh;padding:38px 46px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.top h1{font-size:36px;margin:0}.top .tag{font-size:13px;color:var(--muted)}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.metric b{display:block;font-size:34px}.metric span{font-size:13px;color:var(--muted)}.panel,.card,.note,.alert,.ok{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.note{background:#fafafa}.alert{background:#fff4f4;color:#9b1c1c}.ok{background:#f4fff6}.small{color:var(--muted);font-size:13px}.pill{display:inline-block;border:1px solid var(--red);color:var(--red);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.btn{border:0;border-radius:11px;padding:12px 18px;background:var(--red);color:#fff;font-weight:800;cursor:pointer}.btn.ghost{background:#fff;color:#111;border:1px solid #222}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:980px}.formgrid .full{grid-column:1/-1}input{width:100%;border:1px solid #ddd;background:#fff;border-radius:11px;padding:13px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.shots{display:flex;gap:10px;overflow:auto;margin:14px 0}.shots img{width:150px;height:150px;object-fit:cover;border-radius:12px;border:1px solid #eee}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:30px}.login{width:420px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:38px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.08)}.login .anv{font-size:42px;font-weight:900;color:#2f6fed}.login .silver{letter-spacing:.22em;color:#8d8d8d;font-weight:700}.login .rinnai{font-size:30px;color:var(--red);font-weight:900;margin:14px 0}.login input{margin-top:10px}.login .btn{width:100%;margin-top:10px}.link{color:#111;font-weight:800}@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body><div id="root"></div>
<script>
const state={user:null,tab:'painel',products:[],orders:[],ml:null,notifications:[],open:null};
const $=html=>{document.getElementById('root').innerHTML=html;bind()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const r=await fetch(path,{credentials:'include',headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})},...opts,body:opts.body?JSON.stringify(opts.body):undefined});let d=null;try{d=await r.json()}catch{d={}}if(!r.ok){const msg=typeof d?.detail==='string'?d.detail:(d?.detail?.message||d?.message||`Erro ${r.status}`);throw new Error(msg)}return d}
function num(v){if(v===null||v===undefined||v==='')return null;const m=String(v).replace(',','.').match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):null}
function pUI(p){return {...p,title:p.name||p.title||'Produto',price:Number(p.sale_price??p.price??0),qty:Number(p.stock??p.qty??0),minimum_stock:Number(p.minimum_stock??5),images:(p.images||[]).map?.(x=>typeof x==='string'?x:x.url).filter(Boolean)||[]}}
function pBody(p){return {sku:p.sku||null,name:p.title||p.name||'Produto',brand:p.brand||null,model:p.model||null,material:p.material||null,description:p.description||null,package_length_cm:num(p.length),package_weight_g:num(p.weight),sale_price:Number(p.price||0),stock:Number(p.qty||0),minimum_stock:Number(p.minimum_stock||5),status:'ativo'}}
async function boot(){const q=new URLSearchParams(location.search);if(q.get('ml_connected')==='1'){state.tab='conta';history.replaceState({},'',location.pathname)}try{const me=await api('/api/auth/me');state.user=me.user;await sync();render()}catch{login()}}
async function sync(){try{const ps=await api('/api/products');state.products=Array.isArray(ps)?ps.map(pUI):[]}catch{}try{state.orders=await api('/api/orders')}catch{state.orders=[]}try{state.ml=await api('/api/integrations/mercado-livre/status')}catch{}try{state.notifications=await api('/api/notifications')}catch{state.notifications=[]}}
function login(){ $(`<div class="loginwrap"><div class="login"><div class="anv">ANV</div><div class="silver">AQUECEDORES</div><div class="rinnai">Rinnai</div><p class="small">Filial Digital · acesso administrativo</p><input id="email" placeholder="E-mail"><input id="pw" type="password" placeholder="Senha"><button class="btn" id="enter">Entrar</button><p id="msg" class="small"></p></div></div>`) }
function shell(title,body){const connected=state.ml?.status==='CONECTADO';$(`<div class="app"><aside class="side"><div class="brand">ANV <span>Rinnai</span><div class="subbrand">Filial Digital</div></div><div class="nav"><button data-tab="painel" class="${state.tab==='painel'?'on':''}">Painel</button><button data-tab="produtos" class="${state.tab==='produtos'?'on':''}">Produtos</button><button data-tab="novo" class="${state.tab==='novo'?'on':''}">Cadastrar produto</button><button data-tab="pedidos" class="${state.tab==='pedidos'?'on':''}">Pedidos</button><button data-tab="conta" class="${state.tab==='conta'?'on':''}">Conta / Mercado Livre</button></div><div class="statusbox">Mercado Livre: <b>${connected?'Conectado':'Desconectado'}</b><br>Banco ANV: <b>Ativo</b></div></aside><section class="work"><div class="top"><h1>${esc(title)}</h1><div class="tag">ANV Filial Digital · Desktop</div></div>${body}</section></div>`) }
function painel(){const stock=state.products.reduce((a,p)=>a+Number(p.qty||0),0);const low=state.products.filter(p=>Number(p.qty||0)<=Number(p.minimum_stock||5));const pub=state.products.filter(p=>p.marketplace_status==='PUBLICADO'||p.itemId).length;const notices=state.notifications.filter(n=>!n.read_at).slice(0,4);shell('Painel',`<div class="grid4"><div class="metric"><b>${state.products.length}</b><span>peças e kits</span></div><div class="metric"><b>${stock}</b><span>unidades em estoque</span></div><div class="metric"><b>${pub}</b><span>anúncios vinculados</span></div><div class="metric"><b>${low.length}</b><span>no ponto de compra</span></div></div>${notices.map(n=>`<div class="${n.kind==='NEW_ORDER'?'ok':'alert'}"><b>${esc(n.title)}</b><div class="small">${esc(n.message||'')}</div></div>`).join('')}${low.map(p=>`<div class="alert">${esc(p.title)} chegou em ${Number(p.qty||0)}. Repor.</div>`).join('')}${!state.products.length?'<div class="panel"><b>Nenhuma peça cadastrada ainda.</b><p class="small">Use “Cadastrar produto” para iniciar o catálogo.</p></div>':''}`)}
function produtos(){shell('Produtos',`<div class="cards">${state.products.map(p=>`<div class="card product" data-id="${esc(p.id)}"><b>${esc(p.title)}</b><p class="small">${esc(p.sku||'sem SKU')} · ${esc(p.brand||'sem marca')}</p><p>R$ ${Number(p.price||0).toFixed(2)} · estoque ${Number(p.qty||0)}</p><span class="pill">${esc(p.marketplace_status||p.status||'CADASTRADO')}</span></div>`).join('')}</div>${!state.products.length?'<div class="panel">Nenhum produto ainda.</div>':''}`)}
function novo(){shell('Cadastrar produto',`<div class="panel"><p class="small">Cadastro de peças, flexíveis, mangueiras, kits e componentes. Aquecedor não entra nesta fase.</p><div class="formgrid"><input id="sku" placeholder="SKU"><input id="title" placeholder="Nome da peça"><input id="brand" placeholder="Marca"><input id="model" placeholder="Modelo"><input id="length" placeholder="Comprimento, ex. 40 cm"><input id="material" placeholder="Material"><input id="weight" placeholder="Peso da embalagem, ex. 180 g"><input id="price" type="number" step="0.01" placeholder="Preço de venda"><input id="qty" type="number" placeholder="Estoque"><input id="photo" class="full" type="file" accept="image/*"></div><div class="actions"><button class="btn" id="save">Salvar e preparar anúncio</button></div><p id="msg" class="small"></p></div>`)}
function produto(){const p=state.products.find(x=>x.id===state.open);if(!p){state.tab='produtos';return produtos()}const pf=p.preflight;const cats=(pf?.suggestions||[]).map(c=>`<button class="btn ghost cat" data-cat="${esc(c.category_id)}">${esc(c.category_name||c.category_id)}</button>`).join('');const miss=(pf?.required_missing||[]).map(a=>`<input class="attr" data-attr="${esc(a.id)}" placeholder="${esc(a.name||a.id)}">`).join('');shell(p.title,`<div class="panel"><p class="small">${esc(p.sku||'sem SKU')} · estoque ${Number(p.qty||0)}</p><div class="shots">${(p.images||[]).map(src=>`<img src="${esc(src)}">`).join('')}</div>${pf?`<div class="${pf.ready?'ok':'note'}"><b>${pf.ready?'PRONTO PARA PUBLICAR':'Pré-validação concluída'}</b><p class="small">${esc(pf.selected_category?.name||pf.selected_category?.id||'Categoria em análise')}</p></div>${(pf.blockers||[]).map(x=>`<div class="alert">${esc(x)}</div>`).join('')}${(pf.warnings||[]).map(x=>`<div class="note">${esc(x)}</div>`).join('')}${miss?`<div class="panel"><b>Campos obrigatórios</b>${miss}<button class="btn ghost" id="reval">Revalidar</button></div>`:''}${cats?`<div class="actions">${cats}</div>`:''}`:'<div class="note">O ANV ainda não consultou a categoria e os atributos obrigatórios do Mercado Livre.</div>'}<div class="actions"><button class="btn" id="prepare">${pf?.ready?'Publicar no Mercado Livre':'Preparar anúncio'}</button><button class="btn ghost" data-tab="produtos">Voltar</button></div><p id="msg" class="small"></p></div>`)}
function pedidos(){shell('Pedidos',`${state.orders.map(o=>`<div class="card"><b>${esc(o.provider_order_id||o.id||'Pedido')}</b><p class="small">${(o.items||[]).map(i=>`${esc(i.title||i.seller_sku||i.provider_item_id)} × ${Number(i.quantity||1)}`).join('<br>')||'Itens sincronizando'}</p><span class="pill">${esc(o.operational_status||o.status||'NOVO')}</span><div class="actions"><button class="btn ghost order" data-id="${esc(o.id)}" data-status="SEPARAR">Separar</button><button class="btn ghost order" data-id="${esc(o.id)}" data-status="EMBALAR">Embalar</button><button class="btn ghost order" data-id="${esc(o.id)}" data-status="PRONTO_PARA_ENVIO">Pronto para envio</button></div></div>`).join('')||'<div class="panel">Nenhum pedido recebido ainda.</div>'}<p id="msg" class="small"></p>`)}
function conta(){const connected=state.ml?.status==='CONECTADO';shell('Conta / Mercado Livre',`<div class="${connected?'ok':'note'}"><b>${connected?'Mercado Livre conectado':'Mercado Livre desconectado'}</b><p class="small">${connected?esc(state.ml?.account?.nickname||'Conta autorizada'):'Autorize a conta oficial para publicar e receber pedidos.'}</p></div><div class="actions"><button class="btn" id="connect">${connected?'Reconectar conta':'Conectar conta'}</button><button class="btn ghost" id="logout">Sair</button></div><div class="panel"><b>Status técnico</b><p class="small">Banco ANV: conectado<br>OAuth Mercado Livre: ${connected?'conectado':'aguardando autorização'}<br>Modo vendedor: ${esc(state.ml?.account?.seller_mode||'—')}</p></div>`)}
function render(){if(!state.user)return login();if(state.tab==='painel')return painel();if(state.tab==='produtos')return produtos();if(state.tab==='novo')return novo();if(state.tab==='produto')return produto();if(state.tab==='pedidos')return pedidos();if(state.tab==='conta')return conta();state.tab='painel';painel()}
async function preflight(p){const out=await api('/api/marketplace/preflight',{method:'POST',body:{product_id:p.id,category_id:p.categoryId||null,attributes:p.attrs||{},images:p.images||[]}});p.preflight=out;p.categoryId=out.selected_category?.id||p.categoryId;render()}
async function publish(p){const out=await api('/api/marketplace/publish',{method:'POST',body:{product_id:p.id,category_id:p.categoryId||p.preflight?.selected_category?.id,attributes:p.attrs||{},images:p.images||[],confirm:true}});p.itemId=out.listing?.item_id||out.ml_item?.id;p.preflight=null;await sync();state.tab='produtos';render()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();if(['painel','pedidos','conta'].includes(state.tab))sync().then(render)});const enter=document.getElementById('enter');if(enter)enter.onclick=async()=>{const msg=document.getElementById('msg');try{const out=await api('/api/auth/login',{method:'POST',body:{email:document.getElementById('email').value,password:document.getElementById('pw').value}});state.user=out.user;await sync();state.tab='painel';render()}catch(e){msg.textContent=e.message}};document.querySelectorAll('.product').forEach(c=>c.onclick=()=>{state.open=c.dataset.id;state.tab='produto';render()});const save=document.getElementById('save');if(save)save.onclick=async()=>{const msg=document.getElementById('msg');save.disabled=true;try{const f=document.getElementById('photo').files[0];const img=f?await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)}):null;const body={sku:document.getElementById('sku').value,name:document.getElementById('title').value,brand:document.getElementById('brand').value,model:document.getElementById('model').value,material:document.getElementById('material').value,package_length_cm:num(document.getElementById('length').value),package_weight_g:num(document.getElementById('weight').value),sale_price:Number(document.getElementById('price').value||0),stock:Number(document.getElementById('qty').value||0),minimum_stock:5,status:'ativo'};const created=await api('/api/products',{method:'POST',body});const p=pUI(created);p.images=img?[img]:[];state.products.unshift(p);state.open=p.id;state.tab='produto';render()}catch(e){msg.textContent=e.message}finally{save.disabled=false}};const prep=document.getElementById('prepare');if(prep)prep.onclick=async()=>{const p=state.products.find(x=>x.id===state.open);const msg=document.getElementById('msg');try{if(p.preflight?.ready){await publish(p)}else await preflight(p)}catch(e){msg.textContent=e.message}};document.querySelectorAll('.cat').forEach(c=>c.onclick=()=>{const p=state.products.find(x=>x.id===state.open);p.categoryId=c.dataset.cat;p.preflight=null;preflight(p).catch(()=>{})});const reval=document.getElementById('reval');if(reval)reval.onclick=()=>{const p=state.products.find(x=>x.id===state.open);p.attrs=p.attrs||{};document.querySelectorAll('.attr').forEach(i=>p.attrs[i.dataset.attr]=i.value);preflight(p).catch(()=>{})};document.querySelectorAll('.order').forEach(b=>b.onclick=async()=>{await api(`/api/orders/${b.dataset.id}/operational-status`,{method:'PATCH',body:{status:b.dataset.status}});await sync();render()});const connect=document.getElementById('connect');if(connect)connect.onclick=async()=>{try{const out=await api('/api/integrations/mercado-livre/connect',{method:'POST',body:{}});if(out.authorization_url)location.href=out.authorization_url}catch(e){alert(e.message)}};const logout=document.getElementById('logout');if(logout)logout.onclick=async()=>{await api('/api/auth/logout',{method:'POST',body:{}}).catch(()=>{});state.user=null;login()}}
boot();
</script></body></html>
