name: Validate ANV image research

on:
  push:
    branches:
      - main
      - fix/complete-image-research-flow
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check smart.js
          node --check research.js
          node --check api/vision_node.mjs
          node --check api/anv_ops.mjs
      - name: Check Python API syntax
        run: python -m py_compile api/index.py api/publish_safe.py api/guard.py
      - name: Matching and handoff tests
        run: node --test tests/image_research.test.mjs
