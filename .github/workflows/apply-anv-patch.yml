name: Apply validated ANV patch

on:
  push:
    branches:
      - fix/anv-research-stall-marketplace
    paths:
      - .github/workflows/apply-anv-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify validated patch
        run: |
          curl -fsSL --retry 3 --max-time 30 https://sb-2tm8c0iepuqm.vercel.run/anv.patch.gz.b64 -o /tmp/anv.patch.gz.b64
          echo "0bad2c4f4fa926fdf005b24113b7a2c10892735bf1518f2ee1145c03fdc2762c  /tmp/anv.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/anv.patch.gz.b64 | gzip -d > /tmp/anv.patch
          git apply --check /tmp/anv.patch
      - name: Apply patch and commit
        run: |
          git apply /tmp/anv.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: destravar pesquisa por foto e cruzar Mercado Livre"
          git push origin HEAD:fix/anv-research-stall-marketplace
